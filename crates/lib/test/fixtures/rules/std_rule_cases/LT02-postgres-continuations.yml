rule: LT02
test_postgres_continuation_filter_forbid:
  roundtrip: true
  fail_str: |
    select
      count(*) filter (
        where
        trim(name) != ''
      )
    from t;
  fix_str: |
    select
      count(*) filter (
        where
          trim(name) != ''
      )
    from t;
  configs:
    core:
      dialect: postgres
    indentation:
      tab_space_size: 2
      implicit_indents: forbid
test_postgres_continuation_partial_index_forbid:
  roundtrip: true
  fail_str: |
    create index example_idx on t (id)
    where
    (id is not null);
  fix_str: |
    create index example_idx on t (id)
    where
      (id is not null);
  configs:
    core:
      dialect: postgres
    indentation:
      tab_space_size: 2
      implicit_indents: forbid
test_postgres_continuation_session_set_forbid:
