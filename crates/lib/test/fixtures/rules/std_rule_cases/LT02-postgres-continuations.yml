test_postgres_bracketed_join_scopes_forbid:
  roundtrip: true
  fail_str: |
    select * from (
    foo
    join bar on foo.id = bar.id
    );
  fix_str: |
    select * from (
      foo
        join bar on foo.id = bar.id
    );
  configs:
    core:
      dialect: postgres
    indentation:
      tab_space_size: 2
      indented_joins: true
      implicit_indents: forbid

test_postgres_bracketed_join_scopes_allow:
